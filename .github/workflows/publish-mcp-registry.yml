name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry.
# Runs when a version tag (v*) is pushed, or by hand from the Actions tab.
# Auth is GitHub Actions OIDC: no tokens or secrets are stored in this repo.
#
# Before tagging a new version, update in server.json: "version", the
# package "identifier" (release download URL) and "fileSha256", and attach
# the .mcpb file to the GitHub release. The registry rejects a version that
# is already published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLISHER_VERSION: v1.8.9
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (pinned and checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in to the registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
